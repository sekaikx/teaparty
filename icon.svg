<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#6b3fa0"/>
      <stop offset="1" stop-color="#2a1640"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="1" stop-color="#f3d9c2"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9be15d"/>
      <stop offset="1" stop-color="#4f9e1f"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="244" height="244" rx="56" fill="url(#bg)" stroke="#1d1128" stroke-width="10"/>
  <!-- steam curls, ghostly green -->
  <g fill="none" stroke="#b6f09a" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <path d="M96 78c-14-14 14-22 0-38"/>
    <path d="M128 72c-14-14 14-22 0-38"/>
    <path d="M160 78c-14-14 14-22 0-38"/>
  </g>
  <!-- saucer -->
  <ellipse cx="128" cy="204" rx="92" ry="20" fill="#ff8fb8" stroke="#1d1128" stroke-width="9"/>
  <!-- handle -->
  <path d="M190 118c34 0 36 46 0 50" fill="none" stroke="#1d1128" stroke-width="26" stroke-linecap="round"/>
  <path d="M190 118c34 0 36 46 0 50" fill="none" stroke="#fff6e6" stroke-width="12" stroke-linecap="round"/>
  <!-- cup body -->
  <path d="M52 100h152l-14 76c-3 14-16 22-30 22H96c-14 0-27-8-30-22z" fill="url(#cup)" stroke="#1d1128" stroke-width="10" stroke-linejoin="round"/>
  <!-- poisoned tea surface -->
  <ellipse cx="128" cy="102" rx="74" ry="14" fill="url(#tea)" stroke="#1d1128" stroke-width="8"/>
  <!-- pink rim band -->
  <path d="M60 128h136" stroke="#ff5c8a" stroke-width="10" stroke-linecap="round"/>
  <!-- skull on the cup -->
  <g transform="translate(128 158)">
    <path d="M-24 -6c0-16 11-26 24-26s24 10 24 26c0 9-5 14-10 16v8h-28v-8c-5-2-10-7-10-16z" fill="#1d1128"/>
    <circle cx="-9" cy="-6" r="7" fill="#fff6e6"/>
    <circle cx="9" cy="-6" r="7" fill="#fff6e6"/>
    <path d="M-3 6l3-6 3 6z" fill="#fff6e6"/>
  </g>
  <!-- the poison drop -->
  <path d="M206 34c14 20 22 32 22 44a22 22 0 0 1-44 0c0-12 8-24 22-44z" fill="#7ed957" stroke="#1d1128" stroke-width="8" stroke-linejoin="round"/>
  <ellipse cx="199" cy="76" rx="5" ry="9" fill="#e9ffd9" opacity="0.9"/>
</svg>
